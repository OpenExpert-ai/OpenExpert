name: CI

# Pull requests only. A merge into `main` has already been validated by the pull
# request that produced it, so re-running the whole suite on the merge commit
# paid twice for the same tree: it was ~451 of the ~900 min-robot a month this
# workflow consumed. `workflow_dispatch` covers anything that has to be checked
# on `main` after the fact. `.github/required-checks.md` holds the ruleset that
# makes these checks actually block the merge; until it is applied, a red run
# can still be merged.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Actions are pinned to a full commit SHA (with the version in a trailing
# comment) so a moved tag cannot change what runs here. Dependabot keeps both
# the SHA and the comment up to date.
#
# Least privilege at the top level; a job that needs more asks for it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  # The desktop window and the Docker smoke test only need to run when
  # something they build changed. This is a job, not workflow-level `paths`,
  # because `paths` would skip the whole suite on a documentation pull request
  # and leave the required checks pending forever.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Filter the optional jobs
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # A manual run exercises everything: that is what the button is for.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # What the Tauri build consumes: its crate, the manifests that decide
          # the dependency tree, the Vite config and this workflow.
          desktop_re='^(src-tauri/|(.*/)?package(-lock)?\.json$|vite\.config\.ts$|\.github/workflows/ci\.yml$)'
          # What the image ships: `docker/Dockerfile` copies the app, its
          # public assets, the SQL, the packaging scripts and both workspace
          # packages, so a change anywhere in there has to smoke-test the image.
          docker_re='^(docker/|src/|public/|drizzle/|scripts/|\.changeset/|packages/|(.*/)?package(-lock)?\.json$|tsconfig[^/]*\.json$|vite\.config\.ts$|\.github/workflows/ci\.yml$)'
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")" || {
            # Fail open: if the diff cannot be computed, run every job rather
            # than silently skipping the ones that validate the build.
            echo "cannot diff against origin/${BASE_REF}; running every job" >&2
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if printf '%s\n' "$changed" | grep -Eq "$desktop_re"; then desktop=true; else desktop=false; fi
          if printf '%s\n' "$changed" | grep -Eq "$docker_re"; then docker=true; else docker=false; fi
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop docker=$docker"

  lint-typecheck-test-build:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `github.base_ref` goes through the environment: interpolating a ref name
      # straight into a shell command is how a branch name runs code.
      - name: Commit hygiene (DCO + Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-commits.mjs "origin/${BASE_REF}..HEAD"

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: License headers
        run: npm run license:check

      - name: Documentation links
        run: npm run check:docs

      - name: Typecheck
        run: npm run typecheck && npm run typecheck --workspaces --if-present

      # The runner has no sandbox for `run_python`: `bubblewrap` is not installed and 24.04 restricts
      # unprivileged user namespaces, so `unshare -Urn` fails. With no barrier the module refuses to
      # run at all (that is its contract), so the tests that need to execute a script skip here and
      # `src/lib/python.server.test.ts` checks the refusal instead. A green run of this job does not
      # mean the barrier was exercised; that only happens on a machine with `bubblewrap`.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Build OpenExpert package
        run: npm run build --workspace @openexpert/openexpert

      - name: Build application
        run: npm run build

  # The window is the only artefact a user gets from a source checkout, and the
  # app build above does not cover it: a wrong frontendDist, a missing Tauri CLI
  # or a broken bundle only shows up here. It is also the expensive job (~78 %
  # of this workflow), so it runs only when its inputs change and caches the
  # Rust build.
  desktop-window:
    name: Desktop window (Linux)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # 24.04 instead of `latest`: the job depends on the system WebKitGTK 4.1 and
    # on the Rust toolchain the image ships, so a runner image bump has to be a
    # decision rather than a surprise.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libssl-dev

      - name: Rust toolchain
        run: rustc --version && cargo --version

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The crate is not at the repository root: its target directory is
          # `src-tauri/target`, which the default (`workspaces: .`) would miss.
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: |
          npm run build --workspace @openexpert/openexpert
          npm run build

      # One build, not two: `--no-bundle` compiled and then `--bundles deb`
      # compiled and linked again for the same output.
      - name: Build the desktop window and package it
        run: node_modules/.bin/tauri build --bundles deb

      - name: Check the artefacts
        run: |
          set -euo pipefail
          test -x src-tauri/target/release/openexpert-desktop
          deb="$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)"
          test -n "$deb"
          # El listado se lee una vez y a un fichero: con `dpkg-deb -c | grep -q`
          # el grep cierra la tubería en cuanto encuentra la ruta, tar recibe
          # SIGPIPE al seguir escribiendo y `pipefail` convierte eso en un fallo
          # del paso (exit 2) aunque el .deb esté bien. Pasó en el primer PR que
          # despertó este job tras el cambio de matriz (T-0382).
          listing="$(mktemp)"
          dpkg-deb -c "$deb" >"$listing"
          grep -q 'usr/bin/openexpert-desktop' "$listing"
          grep -q 'usr/share/applications/OpenExpert.desktop' "$listing"
          rm -f "$listing"
          ls -lh "$deb"

  # The image smoke test used to be its own workflow, which duplicated the
  # trigger logic and rebuilt on every push to `main` even when only a Markdown
  # file had changed. Its cache scope is its own: the release workflow builds
  # multi-arch images into the same backend and used to evict this one's cache.
  docker-smoke:
    name: Docker smoke
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          # Load into the local daemon so the smoke test can run it.
          load: true
          provenance: false
          sbom: false
          tags: openexpert:ci-${{ github.sha }}
          cache-from: type=gha,scope=docker-smoke
          cache-to: type=gha,mode=max,scope=docker-smoke

      - name: Smoke test
        run: |
          docker run --rm -d --name openexpert-smoke -p 3000:3000 \
            -e OPENEXPERT_MODEL_PROVIDER=ollama \
            openexpert:ci-${{ github.sha }}
          status=starting
          for _ in $(seq 1 24); do
            status=$(docker inspect --format '{{.State.Health.Status}}' openexpert-smoke 2>/dev/null || echo unknown)
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          echo "health status: $status"
          if [ "$status" != "healthy" ]; then
            docker logs openexpert-smoke || true
            docker stop openexpert-smoke || true
            exit 1
          fi
          curl -fsS http://localhost:3000/ >/dev/null
          docker stop openexpert-smoke

  # actionlint and gitleaks each took a whole runner for a few seconds of work.
  hygiene:
    name: Workflows and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks scans the history, not just the working tree.
          fetch-depth: 0

      # The release tarball is downloaded at a fixed version and its published
      # checksum is verified before the binary is executed: a runner must never
      # run a tool that arrived over the network unpinned and unverified.
      - name: Install actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -sSLO "${base}/actionlint_${version}_checksums.txt"
          curl -sSLO "${base}/actionlint_${version}_linux_amd64.tar.gz"
          grep " actionlint_${version}_linux_amd64\.tar\.gz$" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "actionlint_${version}_linux_amd64.tar.gz" actionlint

      - name: Run actionlint
        run: ./actionlint -color

      # The gitleaks CLI is MIT and needs no license (unlike the Action
      # wrapper, which requires a paid license for organization repos) and its
      # published checksum is verified before use.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -sSLO "${base}/gitleaks_${version}_checksums.txt"
          curl -sSLO "${base}/gitleaks_${version}_linux_x64.tar.gz"
          grep " gitleaks_${version}_linux_x64\.tar\.gz$" "gitleaks_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" -C /usr/local/bin gitleaks

      - name: Scan for secrets
        run: gitleaks detect --source . --redact --verbose --exit-code 1
