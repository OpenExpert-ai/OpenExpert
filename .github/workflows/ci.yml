name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Actions are pinned to a full commit SHA (with the version in a trailing
# comment) so a moved tag cannot change what runs here. Dependabot keeps both
# the SHA and the comment up to date.
#
# Least privilege at the top level; a job that needs more asks for it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  lint-typecheck-test-build:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Commit hygiene (DCO + Conventional Commits)
        if: github.event_name == 'pull_request'
        run: node scripts/check-commits.mjs "origin/${{ github.base_ref }}..HEAD"

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: License headers
        run: npm run license:check

      - name: Documentation links
        run: npm run check:docs

      - name: Typecheck
        run: npm run typecheck && npm run typecheck --workspaces --if-present

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build OpenCore package
        run: npm run build --workspace @openexpert/opencore

      - name: Build application
        run: npm run build

      - name: Upload app build
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openexpert-app
          path: |
            .output
            dist
          if-no-files-found: ignore
          retention-days: 7

  # The window is the only artefact a user gets from a source checkout, and the
  # app build above does not cover it: a wrong frontendDist, a missing Tauri CLI
  # or a broken bundle only shows up here. The Ubuntu runner already ships a
  # Rust toolchain, so this job needs no extra action.
  desktop-window:
    name: Desktop window (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libssl-dev

      - name: Rust toolchain
        run: rustc --version && cargo --version

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: |
          npm run build --workspace @openexpert/opencore
          npm run build

      - name: Build the desktop window
        run: node_modules/.bin/tauri build --no-bundle

      - name: Package a .deb
        run: node_modules/.bin/tauri build --bundles deb

      - name: Check the artefacts
        run: |
          set -euo pipefail
          test -x src-tauri/target/release/openexpert-desktop
          deb="$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)"
          test -n "$deb"
          dpkg-deb -c "$deb" | grep -q 'usr/bin/openexpert-desktop'
          dpkg-deb -c "$deb" | grep -q 'usr/share/applications/OpenExpert.desktop'
          ls -lh "$deb"

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The release tarball is downloaded at a fixed version and its published
      # checksum is verified before the binary is executed: a runner must never
      # run a tool that arrived over the network unpinned and unverified.
      - name: Install actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -sSLO "${base}/actionlint_${version}_checksums.txt"
          curl -sSLO "${base}/actionlint_${version}_linux_amd64.tar.gz"
          grep " actionlint_${version}_linux_amd64\.tar\.gz$" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "actionlint_${version}_linux_amd64.tar.gz" actionlint

      - name: Run actionlint
        run: ./actionlint -color

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The gitleaks CLI is MIT and needs no license (unlike the Action
      # wrapper, which requires a paid license for organization repos) and its
      # published checksum is verified before use.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -sSLO "${base}/gitleaks_${version}_checksums.txt"
          curl -sSLO "${base}/gitleaks_${version}_linux_x64.tar.gz"
          grep " gitleaks_${version}_linux_x64\.tar\.gz$" "gitleaks_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" -C /usr/local/bin gitleaks

      - name: Scan for secrets
        run: gitleaks detect --source . --redact --verbose --exit-code 1
