name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  lint-typecheck-test-build:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Commit hygiene (DCO + Conventional Commits)
        if: github.event_name == 'pull_request'
        run: node scripts/check-commits.mjs "origin/${{ github.base_ref }}..HEAD"

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: License headers
        run: npm run license:check

      - name: Documentation links
        run: npm run check:docs

      - name: Typecheck
        run: npm run typecheck && npm run typecheck --workspaces --if-present

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build OpenCore package
        run: npm run build --workspace @openexpert/opencore

      - name: Build application
        run: npm run build

      - name: Upload app build
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: openexpert-app
          path: |
            .output
            dist
          if-no-files-found: ignore
          retention-days: 7

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Run actionlint
        run: ./actionlint -color

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI is MIT and needs no license (unlike the Action
      # wrapper, which requires a paid license for organization repos).
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan for secrets
        run: gitleaks detect --source . --redact --verbose --exit-code 1
