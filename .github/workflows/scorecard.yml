name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "28 5 * * 1"
  push:
    branches: [main]

# Least privilege at the top level; publishing results and uploading the SARIF
# report are the analysis job's business.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Advisory only: never block the pipeline on a registry hiccup.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Scorecard is advisory: a registry hiccup must not fail the workflow.
      - name: Run analysis
        id: scorecard
        continue-on-error: true
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
