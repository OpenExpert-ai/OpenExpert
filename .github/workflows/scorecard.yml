name: OpenSSF Scorecard

# Weekly, on a branch-protection change and on demand. The `push` trigger was 98
# of the 101 runs in a month and said nothing the weekly sweep does not: the
# score is a periodic signal, not a per-commit gate.
on:
  branch_protection_rule:
  schedule:
    - cron: "28 5 * * 1"
  workflow_dispatch:

# Least privilege at the top level; publishing results and uploading the SARIF
# report are the analysis job's business.
permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Advisory only: a registry hiccup must not fail the workflow. The
      # `continue-on-error` lives on this step and not on the job, so a broken
      # upload below still surfaces instead of being swallowed by a green job.
      - name: Run analysis
        id: scorecard
        continue-on-error: true
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # The only github/codeql-action step in this workflow, so it cannot
      # disagree with itself; keep it on the same version as `codeql.yml` all
      # the same (Dependabot groups them in `.github/dependabot.yml`).
      - name: Upload SARIF
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
