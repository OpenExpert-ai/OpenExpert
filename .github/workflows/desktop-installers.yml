name: Desktop installers

# Unsigned Linux, Windows and macOS packages. This workflow proves the desktop
# shell compiles on each platform and publishes the artefacts for testing; it
# does not sign them. Signing is a release decision that needs certificates and
# belongs in the release workflow once those exist.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  build:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-deb
            bundles: deb
            artifact: src-tauri/target/release/bundle/deb/*.deb
          - os: windows-latest
            label: windows-msi
            bundles: msi
            artifact: src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            label: macos-dmg
            bundles: dmg
            artifact: src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install WebKitGTK build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libssl-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: |
          npm run build --workspace @openexpert/openexpert
          npm run build

      - name: Build the desktop package
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openexpert-${{ matrix.label }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
