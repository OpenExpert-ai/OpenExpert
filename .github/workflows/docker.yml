name: Docker

on:
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "packages/openexpert/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
  push:
    branches: [main]
  # Manual trigger: the image smoke test is the only way to catch a broken
  # Dockerfile, and without this it can only run when one of the paths above
  # happens to change.
  workflow_dispatch:

# This workflow only builds and smoke-tests the image: it never pushes to a
# registry, so read-only access is all it needs. The image that is published
# comes from the Release workflow.
permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          # Load into the local daemon so the smoke test can run it.
          load: true
          provenance: false
          sbom: false
          tags: openexpert:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm -d --name openexpert-smoke -p 3000:3000 \
            -e OPENEXPERT_MODEL_PROVIDER=ollama \
            openexpert:ci-${{ github.sha }}
          status=starting
          for _ in $(seq 1 24); do
            status=$(docker inspect --format '{{.State.Health.Status}}' openexpert-smoke 2>/dev/null || echo unknown)
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          echo "health status: $status"
          if [ "$status" != "healthy" ]; then
            docker logs openexpert-smoke || true
            docker stop openexpert-smoke || true
            exit 1
          fi
          curl -fsS http://localhost:3000/ >/dev/null
          docker stop openexpert-smoke
