name: Docker

on:
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "packages/opencore/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: openexpert:ci-${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm -d --name openexpert-smoke -p 3000:3000 \
            -e OPENEXPERT_MODE=local \
            -e OPENEXPERT_MODEL_PROVIDER=ollama \
            openexpert:ci-${{ github.sha }}
          sleep 10
          curl -fsS http://localhost:3000/auth >/dev/null || true
          docker stop openexpert-smoke || true
