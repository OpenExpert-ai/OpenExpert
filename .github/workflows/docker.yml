name: Docker

on:
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "packages/opencore/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          # Load into the local daemon so the smoke test can run it.
          load: true
          provenance: false
          sbom: false
          tags: openexpert:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm -d --name openexpert-smoke -p 3000:3000 \
            -e OPENEXPERT_MODEL_PROVIDER=ollama \
            openexpert:ci-${{ github.sha }}
          status=starting
          for _ in $(seq 1 24); do
            status=$(docker inspect --format '{{.State.Health.Status}}' openexpert-smoke 2>/dev/null || echo unknown)
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          echo "health status: $status"
          if [ "$status" != "healthy" ]; then
            docker logs openexpert-smoke || true
            docker stop openexpert-smoke || true
            exit 1
          fi
          curl -fsS http://localhost:3000/ >/dev/null
          docker stop openexpert-smoke
