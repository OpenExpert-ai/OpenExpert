name: Server release asset

# Builds the standalone node-server bundle and attaches it (plus its checksum)
# to a GitHub release, so `npx @openexpert/openexpert serve` can download and run
# the local edition without a source checkout.
#
# This workflow cannot rely on `release: published` alone: releases created by
# the changesets action carry the workflow's own GITHUB_TOKEN, and GitHub does
# not start workflows from events that token creates — which is why 0.2.1 and
# 0.3.0 shipped with no assets at all. `release.yml` now builds and attaches the
# bundle in the same run; this one stays for human-created releases and for
# repairing a release by hand (`gh workflow run server-release.yml -f tag=<tag>`,
# which attaches the bundle built from the default branch to the tag you name).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the bundle to (default: the released tag)"
        required: false
        type: string

# Least privilege at the top level; attaching assets to a release is the only
# thing that needs write access.
permissions:
  contents: read

jobs:
  bundle:
    name: Build and attach server bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The default branch, deliberately: the packaging script lives here, while
      # an older tag predates it. A release that shipped without assets is
      # repaired with the bundle for the version this branch builds; an older
      # version is better repaired by cutting a patch release, which attaches its
      # own bundle automatically.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Resolve the target tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${EVENT_TAG:-}}"
          if [ -z "$tag" ]; then
            # The canonical shape: one name, one version (see release.yml).
            tag="v$(node -p "require('./packages/openexpert/package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Attaching the bundle to $tag"

      - name: Build
        run: |
          npm run build --workspace @openexpert/openexpert
          npm run build

      - name: Package
        run: scripts/build-server-bundle.sh

      - name: Attach to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          overwrite_files: true
          files: |
            openexpert-server-*.tar.gz
            openexpert-server-*.tar.gz.sha256
