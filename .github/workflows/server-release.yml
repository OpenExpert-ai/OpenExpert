name: Server release asset

# Builds the standalone node-server bundle and attaches it (plus its
# checksum) to the GitHub release, so `npx @openexpert/opencore serve` can
# download and run the local edition without a source checkout.

on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege at the top level; attaching assets to a release is the only
# thing that needs write access.
permissions:
  contents: read

jobs:
  bundle:
    name: Build and attach server bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: |
          npm run build --workspace @openexpert/opencore
          npm run build

      - name: Package
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/opencore/package.json').version")"
          npm prune --omit=dev --ignore-scripts
          rm -rf pkg
          mkdir -p pkg
          cp -r .output pkg/.output
          cp package.json pkg/package.json
          cp -r node_modules pkg/node_modules
          tar -czf "openexpert-server-${VERSION}.tar.gz" -C pkg .
          sha256sum "openexpert-server-${VERSION}.tar.gz" > "openexpert-server-${VERSION}.tar.gz.sha256"

      - name: Attach to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            openexpert-server-*.tar.gz
            openexpert-server-*.tar.gz.sha256
