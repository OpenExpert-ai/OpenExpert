name: Server release asset

# Builds the standalone node-server bundle and attaches it (plus its checksum)
# to a GitHub release, so `npx @openexpert/openexpert serve` can download and run
# the local edition without a source checkout.
#
# Manual only. `release.yml` already builds and attaches the same bundle in the
# run that publishes the release, so the `release: published` trigger here was a
# second upload of the same asset (`overwrite_files: true` on both sides) racing
# the first one on every release created by hand. What remains is the repair
# hatch for a release that shipped without assets:
#
#   gh workflow run server-release.yml -f tag=vX.Y.Z
#
# which attaches the bundle built from the default branch to the tag you name.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the bundle to (default: the current version)"
        required: false
        type: string

# Least privilege at the top level; attaching assets to a release is the only
# thing that needs write access.
permissions:
  contents: read

jobs:
  bundle:
    name: Build and attach server bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The default branch, deliberately: the packaging script lives here, while
      # an older tag predates it. A release that shipped without assets is
      # repaired with the bundle for the version this branch builds; an older
      # version is better repaired by cutting a patch release, which attaches its
      # own bundle automatically.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Resolve the target tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            # The canonical shape: one name, one version (see release.yml).
            tag="v$(node -p "require('./packages/openexpert/package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Attaching the bundle to $tag"

      - name: Build
        run: |
          npm run build --workspace @openexpert/openexpert
          npm run build

      - name: Package
        run: scripts/build-server-bundle.sh

      - name: Attach to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          overwrite_files: true
          files: |
            openexpert-server-*.tar.gz
            openexpert-server-*.tar.gz.sha256
