name: Release

# Standard Changesets flow: a merge into `main` either opens/updates the
# "version packages" PR or publishes the packages it just versioned.
#
# Publishing uses npm Trusted Publishing (OIDC) with provenance, so no
# `NPM_TOKEN` is needed. Configure the trusted publisher for
# `@openexpert/opencore` and `create-openexpert` on npmjs.com.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - id: changesets
        uses: changesets/action@v2
        with:
          publish-script: npm run release
          version-script: npm run version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          create-github-releases: "true"

  docker:
    name: Build and publish Docker image
    needs: version
    # Only publish an image when a release was actually published, not on every
    # merge into main.
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # GHCR requires lowercase repository names, but the org is `OpenExpert-ai`.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Read package version
        id: pkg
        run: node -e "console.log('version=' + require('./packages/opencore/package.json').version)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.pkg.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
