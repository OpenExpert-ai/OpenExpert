name: Release

# Standard Changesets flow: a merge into `main` either opens/updates the
# "version packages" PR or publishes the packages it just versioned.
#
# Publishing uses npm Trusted Publishing (OIDC) with provenance, so no
# `NPM_TOKEN` is needed. Configure the trusted publisher for
# `@openexpert/openexpert` and `create-openexpert` on npmjs.com.

on:
  push:
    branches: [main]
    # A merge that only touches the prose or the website cannot contain a
    # changeset that matters here, so it does not need to ask "is there
    # anything to version?". `**.md` is deliberately not ignored: a changeset
    # file is Markdown too (`.changeset/*.md`) and filtering it would leave a
    # release unversioned.
    paths-ignore:
      - "docs/**"
      - "site/**"
  workflow_dispatch:

# Least privilege at the top level; each job escalates only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          publish-script: npm run release
          version-script: npm run version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          # The release is created by the job below, not here: changesets names it
          # after the package it published (`<paquete>@<versión>`), and the product
          # has one name and one version. See `server-asset`.
          create-github-releases: "false"

  # The bundle `npx @openexpert/openexpert serve` downloads. It cannot live in its
  # own release-triggered workflow: releases created here carry this run's
  # GITHUB_TOKEN, and GitHub does not start workflows from events that token
  # creates — 0.2.1 and 0.3.0 shipped with no assets because of exactly that.
  server-asset:
    name: Attach the standalone server bundle
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # One name, one version: the tag is `v<versión>` and the release is titled
      # after the product, not after the package. `ensureStandaloneApp` looks for
      # this tag first, so it is also what the CLI downloads.
      - name: Read the version and its notes
        id: release
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/openexpert/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          awk -v v="$version" '$0 == "## " v {p=1; next} p && /^## / {exit} p {print}' \
            packages/openexpert/CHANGELOG.md > notes.md
          echo "release: v$version, $(wc -l < notes.md) líneas de notas"

      - name: Build
        run: |
          npm run build --workspace @openexpert/openexpert
          npm run build

      - name: Package
        run: scripts/build-server-bundle.sh

      # Creates the release when it does not exist yet and attaches the bundle:
      # the shell `npx @openexpert/openexpert serve` downloads.
      - name: Publish the release with its bundle
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: OpenExpert ${{ steps.release.outputs.version }}
          body_path: notes.md
          overwrite_files: true
          files: |
            openexpert-server-*.tar.gz
            openexpert-server-*.tar.gz.sha256

  docker:
    name: Build and publish Docker image
    needs: version
    # Only publish an image when a release was actually published, not on every
    # merge into main.
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # GHCR requires lowercase repository names, but the org is `OpenExpert-ai`.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Read package version
        id: pkg
        run: node -e "console.log('version=' + require('./packages/openexpert/package.json').version)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.pkg.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          provenance: true
          sbom: true
          # Its own cache scope: the single-arch smoke build in `ci.yml` shares
          # this backend and, without a scope, the multi-arch layers here
          # evicted it (and vice versa).
          cache-from: type=gha,scope=release-multiarch
          cache-to: type=gha,mode=max,scope=release-multiarch
