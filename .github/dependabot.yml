version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "@openexpert/*"
      # A TypeScript major cannot install: the toolchain it feeds
      # (typescript-eslint, currently peer `>=4.8.4 <6.1.0`) does not accept it
      # yet, so the whole group PR fails at `npm ci`. Bumping the compiler is a
      # deliberate job for a human, not an automatic PR. The group PR that
      # triggered this (#9) tried 7.0.2 against that range.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    # Actions are pinned to a full commit SHA with the version in a trailing
    # comment; Dependabot updates both.
    schedule:
      interval: "weekly"
    # One pull request per action family instead of one per step. This is not a
    # convenience: `github/codeql-action` refuses to run when the steps of a
    # workflow disagree on the version ("All steps in a workflow that use
    # github/codeql-action must use the same version to work correctly"), and a
    # per-step split is what turned #60, #62 and #64 red on 2026-10-18 — none of
    # them could pass alone. The patterns match sub-actions too
    # (`github/codeql-action/init`, `/autobuild`, `/analyze`, `/upload-sarif`).
    # The catch-all excludes the two families above so no dependency lands in
    # two groups at once.
    groups:
      codeql-action:
        patterns: ["github/codeql-action*"]
      scorecard:
        patterns: ["ossf/scorecard-action"]
      github-actions:
        patterns: ["*"]
        exclude-patterns: ["github/codeql-action*", "ossf/scorecard-action"]
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # The published image must run the runtime CI actually tests (Node 24)
      # and the engines floor (`>=24`). A Node major in the base image is a
      # deliberate move — CI, engines and the image together — not a weekly PR.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
