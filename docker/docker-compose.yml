# SPDX-License-Identifier: MIT
# OpenExpert local edition — zero-config.
#
#   docker compose -f docker/docker-compose.yml up
#   # then open http://localhost:3000
#
# It starts the app and an Ollama server. Pull a model once:
#   docker compose -f docker/docker-compose.yml exec ollama ollama pull llama3.1
#
# To use a different provider, set environment variables, e.g.:
#   OPENEXPERT_MODEL_PROVIDER=google GOOGLE_API_KEY=... docker compose up
#   OPENEXPERT_MODEL_PROVIDER=openexpert OPENEXPERT_GATEWAY_URL=... OPENEXPERT_API_KEY=... docker compose up

name: openexpert

services:
  openexpert:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/openexpert/openexpert:local
    container_name: openexpert
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      OPENEXPERT_MODE: local
      OPENEXPERT_MODEL_PROVIDER: ${OPENEXPERT_MODEL_PROVIDER:-ollama}
      OPENEXPERT_MODEL_ID: ${OPENEXPERT_MODEL_ID:-llama3.1}
      OPENEXPERT_DATA_DIR: /data
      # Ollama's OpenAI-compatible endpoint (note the /v1 suffix).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OPENEXPERT_GATEWAY_URL: ${OPENEXPERT_GATEWAY_URL:-}
      OPENEXPERT_API_KEY: ${OPENEXPERT_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - openexpert-data:/data
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/auth"]
      interval: 30s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: openexpert-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  openexpert-data:
  ollama-data:
