# SPDX-License-Identifier: MIT
# OpenExpert local edition — zero-config.
#
#   docker compose -f docker/docker-compose.yml up
#   # then open http://localhost:3000
#
# It starts the app and an Ollama server. Pull a model once:
#   docker compose -f docker/docker-compose.yml exec ollama ollama pull llama3.1
#
# To use a different provider, set environment variables, e.g.:
#   OPENEXPERT_MODEL_PROVIDER=google GOOGLE_API_KEY=... docker compose up
#
# SECURITY: both services are published on loopback only (127.0.0.1). The app
# has NO login: whoever reaches the port can read and write the workspace,
# reveal the provider API keys and download the backup with the credentials.
# Do not rewrite these as "3000:3000" / "11434:11434" — that publishes them to
# the LAN, which is not what you want on a shared network. See docker/README.md.

name: openexpert

services:
  openexpert:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/openexpert-ai/openexpert:local
    container_name: openexpert
    restart: unless-stopped
    ports:
      # Loopback only, on purpose: the app has no authentication.
      - "127.0.0.1:3000:3000"
    environment:
      OPENEXPERT_MODEL_PROVIDER: ${OPENEXPERT_MODEL_PROVIDER:-ollama}
      OPENEXPERT_MODEL_ID: ${OPENEXPERT_MODEL_ID:-llama3.1}
      OPENEXPERT_DATA_DIR: /data
      # Ollama's OpenAI-compatible endpoint (note the /v1 suffix).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - openexpert-data:/data
    depends_on:
      - ollama
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: openexpert-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      # Loopback only: Ollama has no authentication either, and the app does not
      # need it reachable from anywhere but its own container.
      - "127.0.0.1:11434:11434"

volumes:
  openexpert-data:
  ollama-data:
