[package]
name = "openexpert-desktop"
version = "0.1.0"
description = "OpenExpert desktop shell — native window for the local OpenExpert server."
authors = ["OpenExpert"]
edition = "2021"
license = "MIT"
repository = "https://github.com/OpenExpert-ai/OpenExpert"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
